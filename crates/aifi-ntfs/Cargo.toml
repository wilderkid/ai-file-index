[package]
name = "aifi-ntfs"
description = "Windows-only NTFS VolumeSource: FSCTL_ENUM_USN_DATA enumeration and USN journal reading (read-only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aifi-core.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_WindowsProgramming",
    "Win32_Security",
] }

[lints]
workspace = true
