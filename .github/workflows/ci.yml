name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  windows-cross-check:
    name: cross-check x86_64-pc-windows-gnu (from Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  # MSI 工件：只构建、上传，不发布、不安装。
  msi:
    name: build MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p aifi-service -p aifi-mcp
      - name: install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
      - name: wix build
        run: wix build installer\aifi.wxs -arch x64 -ext WixToolset.Util.wixext -o target\AiFileIndex.msi
      - uses: actions/upload-artifact@v4
        with:
          name: AiFileIndex-msi
          path: target/AiFileIndex.msi
          retention-days: 14

  # NTFS 集成测试（M2/M3 起启用）：在临时 VHD 上运行，绝不碰系统盘。
