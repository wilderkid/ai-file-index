[workspace]
resolver = "3"
members = [
    "crates/aifi-core",
    "crates/aifi-pinyin",
    "crates/aifi-query",
    "crates/aifi-project",
    "crates/aifi-protocol",
    "crates/aifi-harness",
    "crates/aifi-ntfs",
    "crates/aifi-service",
    "crates/aifi-mcp",
]
# 纯逻辑 crate：Linux 上也能 build/test。Windows 专用代码用 cfg(windows) 隔离。
default-members = [
    "crates/aifi-core",
    "crates/aifi-pinyin",
    "crates/aifi-query",
    "crates/aifi-project",
    "crates/aifi-protocol",
    "crates/aifi-harness",
    "crates/aifi-ntfs",
    "crates/aifi-service",
    "crates/aifi-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OWNER/ai-file-index"
authors = ["ai-file-index contributors"]

[workspace.dependencies]
# 内部 crate
aifi-core = { path = "crates/aifi-core" }
aifi-pinyin = { path = "crates/aifi-pinyin" }
aifi-query = { path = "crates/aifi-query" }
aifi-project = { path = "crates/aifi-project" }
aifi-protocol = { path = "crates/aifi-protocol" }
aifi-harness = { path = "crates/aifi-harness" }
aifi-ntfs = { path = "crates/aifi-ntfs" }

# 第三方（版本已于 2026-10 在 crates.io 核实）
thiserror = "2.0.21"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
pinyin = { version = "0.11.0", features = ["heteronym"] }
memchr = "2.8.3"
globset = "0.4.21"
ignore = "0.4.34"
regex = "1.13.1"
nucleo-matcher = "0.3.1"
rayon = "1.12.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
rmcp = { version = "3.8.0", features = ["server", "transport-io"] }
rkyv = "0.8.18"
memmap2 = "0.9.12"
windows = "0.62.2"
windows-service = "0.8.1"
tempfile = "3.27.0"
encoding_rs = "0.8.44"
miniz_oxide = "0.9.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
